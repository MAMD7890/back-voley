app.jwtSecret=${JWT_SECRET:MiClaveSecretaSuperSeguraParaGalacticosAppQueDebeSerMuyLargaParaSerSegura2024JWT}
app.jwtExpiration=86400000

# ========================
# FILE UPLOAD CONFIGURATION
# ========================
