# ========================
# PRODUCCIÓN - GALACTICOS APP
# ========================
spring.application.name=galacticos

# ========================
# DATABASE CONFIGURATION - RDS AWS
# ========================
# Endpoint RDS: bd-galacticos.ca5a0uo8qbi9.us-east-1.rds.amazonaws.com
spring.datasource.url=jdbc:mysql://bd-galacticos.ca5a0uo8qbi9.us-east-1.rds.amazonaws.com:3306/galacticos_app?serverTimezone=UTC&characterEncoding=utf8&allowMultiQueries=true&useSSL=true
spring.datasource.username=galacticos
spring.datasource.password=GALACTICOSSM
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=900000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ========================
# JPA/HIBERNATE CONFIGURATION
# ========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ========================
# SERVER CONFIGURATION
# ========================
server.port=8080
server.servlet.context-path=
server.compression.enabled=true
server.compression.min-response-size=1024

# ========================
# LOGGING - PRODUCCIÓN
# ========================
logging.level.root=WARN
logging.level.galacticos_app_back=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.file.name=logs/galacticos.log
logging.file.max-size=10MB
logging.file.max-history=30

# ========================
# JWT SECURITY
# ========================
jwt.secret=${JWT_SECRET:MiClaveSecretaSuperSeguraParaGalacticosAppQueDebeSerMuyLargaParaSerSegura2024JWT}
