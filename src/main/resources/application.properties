# ========================
# CONFIGURACIÓN MYSQL
# ========================
spring.application.name=galacticos
spring.datasource.url=jdbc:mysql://localhost:3306/voleiboll?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# CONFIGURACIÓN JPA/HIBERNATE
# ========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ========================
# LOGGING
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ========================
# JWT CONFIGURATION
# ========================
jwt.secret=MiClaveSecretaSuperSeguraParaGalacticosAppQueDebeSerMuyLargaParaSerSegura2024JWT
jwt.expiration=600000
jwt.refresh-expiration=604800000

# ========================
# FILE UPLOAD CONFIGURATION
# ========================
file.upload-dir=uploads
file.max-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

